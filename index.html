<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de damas do Prof. Marins</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #f39c12;
      text-align: center;
      margin-bottom: 15px;
      font-size: 2rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .status-panel {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      align-items: center;
      background: #2a2a40;
      padding: 12px 24px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .turn-indicator {
      font-weight: bold;
      font-size: 1rem;
      padding: 4px 10px;
      border-radius: 5px;
    }
    .turn-red { background: #e74c3c; color: #fff; }
    .turn-black { background: #34495e; color: #fff; border: 1px solid #7f8c8d; }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: min(85vw, 480px);
      height: min(85vw, 480px);
      border: 6px solid #2c3e50;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .square.light { background-color: #f0d9b5; }
    .square.dark { background-color: #b58863; }
    .square.selected { background-color: #769656 !important; }
    .square.highlight { position: relative; cursor: pointer; }
    .square.highlight::after {
      content: '';
      width: 30%;
      height: 30%;
      background: rgba(46, 204, 113, 0.8);
      border-radius: 50%;
      position: absolute;
    }
    .piece {
      width: 80%;
      height: 80%;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
      user-select: none;
    }
    .piece:hover { transform: scale(1.05); }
    .piece.red {
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
      border: 2px solid #962d22;
    }
    .piece.black {
      background: radial-gradient(circle at 30% 30%, #555, #111);
      border: 2px solid #000;
    }
    .piece.king::after {
      content: '👑';
      font-size: 1.2rem;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #f39c12;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #d35400; transform: translateY(-2px); }
  </style>
</head>
<body>

  <h1>Jogo de damas do Prof. Marins</h1>

  <div class="status-panel">
    <div>Vez de: <span id="turn-text" class="turn-indicator turn-red">Vermelho</span></div>
    <div>Placar: <span id="score-red">🔴 12</span> | <span id="score-black">⚫ 12</span></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button onclick="resetGame()">Reiniciar Jogo</button>
  </div>

  <script>
    const boardElement = document.getElementById('board');
    const turnText = document.getElementById('turn-text');
    const scoreRed = document.getElementById('score-red');
    const scoreBlack = document.getElementById('score-black');

    let board = [];
    let turn = 'red';
    let selectedPiece = null;
    let possibleMoves = [];

    function initBoard() {
      board = Array(8).fill(null).map(() => Array(8).fill(null));
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if ((r + c) % 2 === 1) {
            if (r < 3) board[r][c] = { color: 'black', king: false };
            else if (r > 4) board[r][c] = { color: 'red', king: false };
          }
        }
      }
      turn = 'red';
      selectedPiece = null;
      possibleMoves = [];
      render();
    }

    function render() {
      boardElement.innerHTML = '';
      let redCount = 0, blackCount = 0;

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
          square.dataset.row = r;
          square.dataset.col = c;

          const piece = board[r][c];
          if (piece) {
            if (piece.color === 'red') redCount++;
            if (piece.color === 'black') blackCount++;

            const pElem = document.createElement('div');
            pElem.className = `piece ${piece.color} ${piece.king ? 'king' : ''}`;
            square.appendChild(pElem);
          }

          if (selectedPiece && selectedPiece.row === r && selectedPiece.col === c) {
            square.classList.add('selected');
          }

          const move = possibleMoves.find(m => m.row === r && m.col === c);
          if (move) {
            square.classList.add('highlight');
            square.addEventListener('click', () => executeMove(move));
          } else {
            square.addEventListener('click', () => handleSquareClick(r, c));
          }

          boardElement.appendChild(square);
        }
      }

      turnText.textContent = turn === 'red' ? 'Vermelho' : 'Preto';
      turnText.className = `turn-indicator turn-${turn}`;
      scoreRed.textContent = `🔴 ${redCount}`;
      scoreBlack.textContent = `⚫ ${blackCount}`;

      if (redCount === 0) alert('As peças Pretas venceram!');
      else if (blackCount === 0) alert('As peças Vermelhas venceram!');
    }

    function handleSquareClick(r, c) {
      const piece = board[r][c];
      if (piece && piece.color === turn) {
        selectedPiece = { row: r, col: c };
        possibleMoves = getValidMoves(r, c);
        render();
      } else {
        selectedPiece = null;
        possibleMoves = [];
        render();
      }
    }

    function getValidMoves(r, c) {
      const piece = board[r][c];
      if (!piece) return [];
      const moves = [];
      const directions = piece.king 
        ? [[-1, -1], [-1, 1], [1, -1], [1, 1]]
        : piece.color === 'red' ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];

      directions.forEach(([dr, dc]) => {
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc)) {
          if (!board[nr][nc]) {
            moves.push({ row: nr, col: nc });
          } else if (board[nr][nc].color !== piece.color) {
            const jnr = r + dr * 2, jnc = c + dc * 2;
            if (inBounds(jnr, jnc) && !board[jnr][jnc]) {
              moves.push({ row: jnr, col: jnc, captured: { row: nr, col: nc } });
            }
          }
        }
      });
      return moves;
    }

    function inBounds(r, c) {
      return r >= 0 && r < 8 && c >= 0 && c < 8;
    }

    function executeMove(move) {
      const { row: r, col: c } = selectedPiece;
      const piece = board[r][c];
      
      board[r][c] = null;
      board[move.row][move.col] = piece;

      if (move.captured) {
        board[move.captured.row][move.captured.col] = null;
      }

      if ((piece.color === 'red' && move.row === 0) || (piece.color === 'black' && move.row === 7)) {
        piece.king = true;
      }

      turn = turn === 'red' ? 'black' : 'red';
      selectedPiece = null;
      possibleMoves = [];
      render();
    }

    function resetGame() {
      initBoard();
    }

    initBoard();
  </script>
</body>
</html>
