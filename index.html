<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de damas do Prof. Marins</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #f39c12;
      text-align: center;
      margin-bottom: 15px;
      font-size: 2rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .panel {
      background: #2a2a40;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      width: min(90vw, 480px);
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .online-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    input[type="text"] {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1e1e2f;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      width: 140px;
      text-transform: uppercase;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 5px;
      background: #34495e;
    }
    .status-online { background: #27ae60; }
    .status-waiting { background: #e67e22; }
    .turn-indicator {
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 5px;
      display: inline-block;
    }
    .turn-red { background: #e74c3c; color: #fff; }
    .turn-black { background: #34495e; color: #fff; border: 1px solid #7f8c8d; }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: min(85vw, 480px);
      height: min(85vw, 480px);
      border: 6px solid #2c3e50;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .square.light { background-color: #f0d9b5; }
    .square.dark { background-color: #b58863; }
    .square.selected { background-color: #769656 !important; }
    .square.highlight { position: relative; cursor: pointer; }
    .square.highlight::after {
      content: '';
      width: 30%;
      height: 30%;
      background: rgba(46, 204, 113, 0.8);
      border-radius: 50%;
      position: absolute;
    }
    .piece {
      width: 80%;
      height: 80%;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
      user-select: none;
    }
    .piece:hover { transform: scale(1.05); }
    .piece.red {
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
      border: 2px solid #962d22;
    }
    .piece.black {
      background: radial-gradient(circle at 30% 30%, #555, #111);
      border: 2px solid #000;
    }
    .piece.king::after {
      content: '👑';
      font-size: 1.2rem;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      background: #f39c12;
      color: #fff;
      border: none;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #d35400; }
    button:disabled { background: #7f8c8d; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Jogo de damas do Prof. Marins</h1>

  <div class="panel">
    <div><strong>Modo de Jogo:</strong></div>
    <div style="margin: 8px 0;">
      <label><input type="radio" name="mode" value="local" checked onclick="setMode('local')"> Mesmo Aparelho</label>
      &nbsp;&nbsp;
      <label><input type="radio" name="mode" value="online" onclick="setMode('online')"> Online (2 Aparelhos)</label>
    </div>

    <div id="online-panel" class="online-controls" style="display: none;">
      <div id="connection-status" class="status-badge status-waiting">Desconectado</div>
      <div class="input-group">
        <button onclick="createRoom()">Criar Sala</button>
        <input type="text" id="room-code-input" placeholder="Código" maxlength="6">
        <button onclick="joinRoom()">Entrar</button>
      </div>
      <div id="room-info" style="font-size: 0.9rem; color: #f1c40f;"></div>
    </div>
  </div>

  <div class="panel" style="display: flex; justify-content: space-around; align-items: center;">
    <div>Vez de: <span id="turn-text" class="turn-indicator turn-red">Vermelho</span></div>
    <div>Sua Cor: <strong id="my-color">Vermelho / Preto (Local)</strong></div>
    <div>Placar: <span id="score-red">🔴 12</span> | <span id="score-black">⚫ 12</span></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button onclick="resetGame()">Reiniciar Jogo</button>
  </div>

  <script>
    const boardElement = document.getElementById('board');
    const turnText = document.getElementById('turn-text');
    const scoreRed = document.getElementById('score-red');
    const scoreBlack = document.getElementById('score-black');
    const connectionStatus = document.getElementById('connection-status');
    const roomInfo = document.getElementById('room-info');
    const myColorText = document.getElementById('my-color');

    let board = [];
    let turn = 'red';
    let selectedPiece = null;
    let possibleMoves = [];
    
    let gameMode = 'local'; // 'local' ou 'online'
    let myColor = 'both';  // 'red', 'black', ou 'both'
    let peer = null;
    let conn = null;

    function setMode(mode) {
      gameMode = mode;
      document.getElementById('online-panel').style.display = mode === 'online' ? 'flex' : 'none';
      if (mode === 'local') {
        myColor = 'both';
        myColorText.textContent = 'Vermelho / Preto (Local)';
        if (peer) peer.destroy();
        resetGame();
      } else {
        myColorText.textContent = 'Aguardando Sala...';
      }
    }

    function createRoom() {
      const roomCode = Math.floor(100000 + Math.random() * 900000).toString();
      initPeer('marins-damas-' + roomCode, () => {
        myColor = 'red';
        myColorText.textContent = '🔴 Vermelho (Criador)';
        roomInfo.textContent = `Passe este código para seu colega: ${roomCode}`;
        connectionStatus.textContent = 'Aguardando colega entrar...';
        connectionStatus.className = 'status-badge status-waiting';
      });
    }

    function joinRoom() {
      const code = document.getElementById('room-code-input').value.trim();
      if (!code) return alert('Digite o código da sala!');

      initPeer(null, () => {
        myColor = 'black';
        myColorText.textContent = '⚫ Preto (Convidado)';
        conn = peer.connect('marins-damas-' + code);
        setupConnection();
      });
    }

    function initPeer(id, onOpen) {
      if (peer) peer.destroy();
      peer = id ? new Peer(id) : new Peer();

      peer.on('open', () => {
        if (onOpen) onOpen();
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
      });

      peer.on('error', (err) => {
        alert('Erro de conexão: ' + err.type);
      });
    }

    function setupConnection() {
      conn.on('open', () => {
        connectionStatus.textContent = 'Conectado!';
        connectionStatus.className = 'status-badge status-online';
        if (myColor === 'red') {
          roomInfo.textContent = 'O outro jogador entrou!';
          sendState();
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'STATE') {
          board = data.board;
          turn = data.turn;
          render();
        }
      });

      conn.on('close', () => {
        connectionStatus.textContent = 'Colega desconectou';
        connectionStatus.className = 'status-badge status-waiting';
      });
    }

    function sendState() {
      if (conn && conn.open) {
        conn.send({ type: 'STATE', board: board, turn: turn });
      }
    }

    function initBoard() {
      board = Array(8).fill(null).map(() => Array(8).fill(null));
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if ((r + c) % 2 === 1) {
            if (r < 3) board[r][c] = { color: 'black', king: false };
            else if (r > 4) board[r][c] = { color: 'red', king: false };
          }
        }
      }
      turn = 'red';
      selectedPiece = null;
      possibleMoves = [];
      render();
    }

    function render() {
      boardElement.innerHTML = '';
      let redCount = 0, blackCount = 0;

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;

          const piece = board[r][c];
          if (piece) {
            if (piece.color === 'red') redCount++;
            if (piece.color === 'black') blackCount++;

            const pElem = document.createElement('div');
            pElem.className = `piece ${piece.color} ${piece.king ? 'king' : ''}`;
            square.appendChild(pElem);
          }

          if (selectedPiece && selectedPiece.row === r && selectedPiece.col === c) {
            square.classList.add('selected');
          }

          const move = possibleMoves.find(m => m.row === r && m.col === c);
          if (move) {
            square.classList.add('highlight');
            square.addEventListener('click', () => executeMove(move));
          } else {
            square.addEventListener('click', () => handleSquareClick(r, c));
          }

          boardElement.appendChild(square);
        }
      }

      turnText.textContent = turn === 'red' ? 'Vermelho' : 'Preto';
      turnText.className = `turn-indicator turn-${turn}`;
      scoreRed.textContent = `🔴 ${redCount}`;
      scoreBlack.textContent = `⚫ ${blackCount}`;

      if (redCount === 0) alert('As peças Pretas venceram!');
      else if (blackCount === 0) alert('As peças Vermelhas venceram!');
    }

    function handleSquareClick(r, c) {
      if (gameMode === 'online' && myColor !== turn) return;

      const piece = board[r][c];
      if (piece && piece.color === turn) {
        selectedPiece = { row: r, col: c };
        possibleMoves = getValidMoves(r, c);
        render();
      } else {
        selectedPiece = null;
        possibleMoves = [];
        render();
      }
    }

    function getValidMoves(r, c) {
      const piece = board[r][c];
      if (!piece) return [];
      const moves = [];
      const directions = piece.king 
        ? [[-1, -1], [-1, 1], [1, -1], [1, 1]]
        : piece.color === 'red' ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];

      directions.forEach(([dr, dc]) => {
        const nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc)) {
          if (!board[nr][nc]) {
            moves.push({ row: nr, col: nc });
          } else if (board[nr][nc].color !== piece.color) {
            const jnr = r + dr * 2, jnc = c + dc * 2;
            if (inBounds(jnr, jnc) && !board[jnr][jnc]) {
              moves.push({ row: jnr, col: jnc, captured: { row: nr, col: nc } });
            }
          }
        }
      });
      return moves;
    }

    function inBounds(r, c) {
      return r >= 0 && r < 8 && c >= 0 && c < 8;
    }

    function executeMove(move) {
      const { row: r, col: c } = selectedPiece;
      const piece = board[r][c];
      
      board[r][c] = null;
      board[move.row][move.col] = piece;

      if (move.captured) {
        board[move.captured.row][move.captured.col] = null;
      }

      if ((piece.color === 'red' && move.row === 0) || (piece.color === 'black' && move.row === 7)) {
        piece.king = true;
      }

      turn = turn === 'red' ? 'black' : 'red';
      selectedPiece = null;
      possibleMoves = [];

      if (gameMode === 'online') {
        sendState();
      }

      render();
    }

    function resetGame() {
      initBoard();
      if (gameMode === 'online') sendState();
    }

    initBoard();
  </script>
</body>
</html>
